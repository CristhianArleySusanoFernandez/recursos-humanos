{% extends "base.html" %}
{% block title %}Nuevo empleado – RRHH Docs{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-header bg-white fw-semibold">
        Nuevo empleado
      </div>
      <div class="card-body">
        <form method="POST" action="/new">
          <div class="mb-3">
            <label for="name" class="form-label">Nombre completo</label>
            <input type="text" id="name" name="name" class="form-control"
                   value="{{ employee.name if employee else '' }}"
                   required autofocus />
          </div>
          <div class="mb-3">
            <label for="position" class="form-label">Cargo</label>
            <input type="text" id="position" name="position" class="form-control"
                   value="{{ employee.position if employee else '' }}"
                   required />
          </div>
          <div class="mb-4">
            <label for="group_id" class="form-label">Grupo</label>
            <select id="group_id" name="group_id" class="form-select" required>
              <option value="" disabled selected>— Selecciona un subgrupo —</option>
              {% for root in groups %}
              <optgroup label="{{ root.name }}">
                {% for child in root.children %}
                <option value="{{ child.id }}"
                  {% if employee and employee.group_id == child.id %}selected{% endif %}>
                  {{ child.name }}
                </option>
                {% endfor %}
              </optgroup>
              {% endfor %}
            </select>
            <div class="form-text">
              Solo se pueden seleccionar subgrupos (nivel 2).
            </div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Crear empleado</button>
            <a href="/" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
