<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}DST RRHH{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231a2466'/><text y='.9em' font-size='80' x='10'>📋</text></svg>">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <style>
    /* ── Paleta corporativa ───────────────────────────────────── */
    :root {
      --color-primary:       #1a2466;
      --color-primary-light: #29abe2;
      --color-accent:        #f5a623;
      --color-accent-dark:   #c0392b;
      --color-bg:            #f4f6fb;
      --color-surface:       #ffffff;
      --color-text:          #1a2466;
      --color-text-muted:    #6b7280;

      --thead-inner-bg:    #e8f4fb;
      --thead-inner-color: #1a2466;
      --card-bg:           #ffffff;
      --input-bg:          #ffffff;
      --input-color:       #1a2466;
      --border-color:      #dee2e6;
      --hover-row:         #f0f7ff;
      --subgroup-bg:       #e8f4fb;
      --subgroup-color:    #1a2466;
      --modal-bg:          #ffffff;
      --modal-color:       #1a2466;
      --table-row-bg:      #ffffff;
      --table-row-color:   #1a2466;
      --progress-track:    #e9ecef;
    }

    /* ── Dark mode ────────────────────────────────────────────── */
    body.dark-mode {
      --color-primary:       #29abe2;
      --color-primary-light: #56c5f0;
      --color-bg:            #0f172a;
      --color-surface:       #1e293b;
      --color-text:          #e2e8f0;
      --color-text-muted:    #94a3b8;

      --thead-inner-bg:    #1e3a5f;
      --thead-inner-color: #e2e8f0;
      --card-bg:           #1e293b;
      --input-bg:          #0f172a;
      --input-color:       #e2e8f0;
      --border-color:      #334155;
      --hover-row:         #263548;
      --subgroup-bg:       #1e3a5f;
      --subgroup-color:    #e2e8f0;
      --modal-bg:          #1e293b;
      --modal-color:       #e2e8f0;
      --table-row-bg:      #1e293b;
      --table-row-color:   #e2e8f0;
      --progress-track:    #334155;
    }

    /* ── Base ─────────────────────────────────────────────────── */
    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      transition: background-color .25s, color .25s;
    }

    /* ── Navbar ───────────────────────────────────────────────── */
    .navbar-dst {
      background-color: #1a2466;
      box-shadow: 0 2px 8px rgba(0,0,0,.22);
      padding-top: 6px;
      padding-bottom: 6px;
    }
    body.dark-mode .navbar-dst { background-color: #0d1a3a; }
    .navbar-dst .navbar-brand { display: flex; align-items: center; }
    .navbar-dst .nav-link { color: rgba(255,255,255,.82); }
    .navbar-dst .nav-link:hover,
    .navbar-dst .nav-link.active { color: var(--color-primary-light); }

    /* ── Cards ────────────────────────────────────────────────── */
    .card {
      border: none;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      background-color: var(--card-bg);
      transition: background-color .25s;
    }
    .card-header { border-radius: 8px 8px 0 0 !important; font-weight: 700; }
    .card-header-primary { background-color: #1a2466; color: #fff; }
    body.dark-mode .card-header-primary { background-color: #162050; }
    .card-header-accent  { background-color: var(--color-accent-dark); color: #fff; }
    .card-header-light   { background-color: var(--card-bg); color: var(--color-text); }
    .card-body { background-color: var(--card-bg); color: var(--color-text); }

    /* ── Tablas ───────────────────────────────────────────────── */
    .thead-dst th {
      background-color: #1a2466;
      color: #fff;
      white-space: nowrap;
      font-weight: 600;
    }
    body.dark-mode .thead-dst th { background-color: #162050; }

    .thead-inner th {
      background-color: var(--thead-inner-bg);
      color: var(--thead-inner-color);
      white-space: nowrap;
      font-weight: 600;
    }

    /* Filas y celdas — sobreescribe Bootstrap que hardcodea #fff */
    .table { color: var(--table-row-color); }
    .table > :not(caption) > * > * {
      background-color: var(--table-row-bg);
      color: var(--table-row-color);
      border-color: var(--border-color);
    }
    .table-hover > tbody > tr:hover > * {
      background-color: var(--hover-row) !important;
      color: var(--table-row-color);
    }

    /* table-secondary en dark */
    body.dark-mode .table-secondary > td,
    body.dark-mode .table-secondary     { background-color: #1a2f4a !important; }

    /* ── Sub-headers ──────────────────────────────────────────── */
    .subgroup-header {
      background-color: var(--subgroup-bg);
      color: var(--subgroup-color);
      font-weight: 600;
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      padding: .5rem 1rem;
    }

    /* ── Botones corporativos ─────────────────────────────────── */
    .btn-dst-primary {
      background-color: var(--color-primary-light);
      border-color:     var(--color-primary-light);
      color: #fff;
    }
    .btn-dst-primary:hover { background-color: #1d90c5; border-color: #1d90c5; color: #fff; }

    .btn-dst-secondary {
      background-color: transparent;
      border-color: var(--color-primary);
      color: var(--color-primary);
    }
    .btn-dst-secondary:hover { background-color: var(--color-primary); color: #fff; }
    body.dark-mode .btn-dst-secondary {
      border-color: var(--color-primary-light);
      color: var(--color-primary-light);
    }
    body.dark-mode .btn-dst-secondary:hover {
      background-color: var(--color-primary-light);
      color: #fff;
    }

    .btn-dst-danger {
      background-color: var(--color-accent-dark);
      border-color:     var(--color-accent-dark);
      color: #fff;
    }
    .btn-dst-danger:hover { background-color: #a93226; border-color: #a93226; color: #fff; }

    /* ── Links ────────────────────────────────────────────────── */
    a { color: var(--color-primary-light); }
    a:hover { color: var(--color-primary); }

    /* ── Títulos de sección ───────────────────────────────────── */
    .page-title {
      font-weight: 700;
      color: var(--color-text);
      border-left: 4px solid var(--color-primary-light);
      padding-left: .75rem;
    }

    /* ── Badges de estado ─────────────────────────────────────── */
    .badge-presente { background-color: #27ae60; color: #fff; }
    .badge-faltante { background-color: var(--color-accent-dark); color: #fff; }
    .badge-na       { background-color: #6b7280; color: #fff; }
    .badge-status {
      font-size: .75rem; min-width: 80px; display: inline-block;
      text-align: center; padding: .3em .6em; border-radius: 4px;
    }

    /* ── Barras de progreso ───────────────────────────────────── */
    .progress {
      border-radius: 6px;
      background-color: var(--progress-track);
    }
    .bar-good    { background-color: #27ae60 !important; }
    .bar-warning { background-color: var(--color-accent) !important; }
    .bar-danger  { background-color: var(--color-accent-dark) !important; }

    /* ── Sección de subida ────────────────────────────────────── */
    .card-upload { border-top: 4px solid var(--color-accent) !important; }

    /* ── Inputs / selects / modales en dark ───────────────────── */
    body.dark-mode .form-control,
    body.dark-mode .form-select {
      background-color: var(--input-bg);
      color: var(--input-color);
      border-color: var(--border-color);
    }
    body.dark-mode .modal-content {
      background-color: var(--modal-bg);
      color: var(--modal-color);
    }
    body.dark-mode .modal-footer { border-color: var(--border-color); }
    body.dark-mode .text-muted,
    body.dark-mode .form-text    { color: var(--color-text-muted) !important; }
    body.dark-mode .alert-info   { background-color: #1e3a5f; color: #e2e8f0; border-color: #2d5a8e; }

    /* ── Dark toggle button ───────────────────────────────────── */
    #darkToggle, #darkToggleMobile {
      background: transparent;
      border: 1px solid rgba(255,255,255,.35);
      color: #fff;
      border-radius: 6px;
      padding: .25rem .6rem;
      font-size: 1rem;
      line-height: 1.4;
      cursor: pointer;
    }
    #darkToggle:hover, #darkToggleMobile:hover { background: rgba(255,255,255,.12); }

    /* ── Misc ─────────────────────────────────────────────────── */
    .mb-section { margin-bottom: 2rem; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dst mb-4">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="/">
      <img src="/static/logo.png" height="60" alt="DST Logo"
           style="filter:brightness(0) invert(1);object-fit:contain;display:block;"
           onerror="this.style.display='none';document.getElementById('brandFallback').style.display='inline';" />
      <span id="brandFallback"
            style="display:none;color:var(--color-primary-light);font-weight:700;font-size:1.2rem;">
        DST
      </span>
    </a>

    <div class="d-flex align-items-center gap-2 ms-auto me-2 d-lg-none">
      <button id="darkToggleMobile" title="Modo oscuro">🌙</button>
      <button class="navbar-toggler border-0" type="button"
              data-bs-toggle="collapse" data-bs-target="#navMain"
              style="filter:invert(1);">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>

    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto gap-1">
        <li class="nav-item"><a class="nav-link" href="/">Empleados</a></li>
        <li class="nav-item"><a class="nav-link" href="/inactive">Inactivos</a></li>
        <li class="nav-item"><a class="nav-link" href="/groups">Grupos</a></li>
        <li class="nav-item"><a class="nav-link" href="/document-types">Tipos de documento</a></li>
        <li class="nav-item"><a class="nav-link" href="/reclassify">Recategorizar</a></li>
      </ul>
      <button id="darkToggle" class="d-none d-lg-block" title="Modo oscuro">🌙</button>
    </div>
  </div>
</nav>

<div class="container-fluid px-4 pb-5">
  {% if error %}
  <div class="alert alert-danger alert-dismissible fade show" role="alert">
    {{ error }}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  {% endif %}
  {% if success %}
  <div class="alert alert-success alert-dismissible fade show" role="alert">
    {{ success }}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  {% endif %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function () {
  var STORAGE_KEY = 'dst-dark-mode';

  function setDark(on) {
    document.body.classList.toggle('dark-mode', on);
    var icon = on ? '☀️' : '🌙';
    ['darkToggle', 'darkToggleMobile'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.textContent = icon;
    });
    localStorage.setItem(STORAGE_KEY, on ? '1' : '0');
  }

  if (localStorage.getItem(STORAGE_KEY) === '1') setDark(true);

  ['darkToggle', 'darkToggleMobile'].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('click', function () {
      setDark(!document.body.classList.contains('dark-mode'));
    });
  });
})();
</script>
</body>
</html>
